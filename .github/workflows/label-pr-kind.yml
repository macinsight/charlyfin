name: label pull request kind

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply kind labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const pullNumber = pullRequest.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 }
            );
            const title = pullRequest.title.toLowerCase();
            const dependency = /(^|[\s(:])deps?(?:[\s):]|$)|renovate/.test(title);
            const documentation = files.length > 0 &&
              files.every(({ filename }) =>
                filename.endsWith('.md') || filename.startsWith('docs/'));
            const bug = /(^|[\s(:])fix(?:es)?(?:[\s):]|$)|bug|hotfix/.test(title);
            const kind = dependency ? 'chore/deps'
              : documentation ? 'kind/docs'
              : bug ? 'kind/bug'
              : 'kind/feature';
            const current = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: pullNumber, per_page: 100
            });
            for (const label of current.data
              .map(({ name }) => name)
              .filter((name) =>
                name.startsWith('kind/') || name === 'chore/deps')) {
              await github.rest.issues.removeLabelFromIssue({
                owner, repo, issue_number: pullNumber, name: label
              });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pullNumber, labels: [kind]
            });
            core.notice(`Applied ${kind}`);
