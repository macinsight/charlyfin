name: label pull request size

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 }
            );
            const changedLines = files.reduce(
              (total, file) => total + file.additions + file.deletions,
              0
            );
            const size = changedLines < 10 ? 'size:XS'
              : changedLines < 30 ? 'size:S'
              : changedLines < 100 ? 'size:M'
              : changedLines < 500 ? 'size:L'
              : changedLines < 1000 ? 'size:XL'
              : 'size:XXL';
            const current = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: pullNumber, per_page: 100
            });
            for (const label of current.data
              .map(({ name }) => name)
              .filter((name) => name.startsWith('size:'))) {
              await github.rest.issues.removeLabelFromIssue({
                owner, repo, issue_number: pullNumber, name: label
              });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pullNumber, labels: [size]
            });
            core.notice(`Applied ${size} (${changedLines} changed lines)`);
