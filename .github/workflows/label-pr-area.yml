name: label pull request area

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  area:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply area labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 }
            );
            const areaByPath = [
              ['area/ci', (path) => path.startsWith('.github/')],
              ['area/build', (path) =>
                path === 'Containerfile' || path === 'Justfile' ||
                path.startsWith('build/')],
              ['area/runtime', (path) => path.startsWith('custom/')],
              ['area/docs', (path) =>
                path.endsWith('.md') || path.startsWith('docs/')]
            ];
            const areas = areaByPath
              .filter(([, matches]) => files.some(({ filename }) => matches(filename)))
              .map(([label]) => label);
            const current = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: pullNumber, per_page: 100
            });
            for (const label of current.data
              .map(({ name }) => name)
              .filter((name) => name.startsWith('area/'))) {
              await github.rest.issues.removeLabelFromIssue({
                owner, repo, issue_number: pullNumber, name: label
              });
            }
            if (areas.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pullNumber, labels: areas
              });
            }
            core.notice(`Applied area labels: ${areas.join(', ') || 'none'}`);
