name: enforce workflow labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce-issues:
    if: github.event_name == 'issues'
    uses: projectbluefin/actions/.github/workflows/reusable-design-enforcement.yml@ce7ab75eb66d3ace300fed4c121a31b417e8f9fe
    with:
      required-field-groups: '[["What happened?","What would you like to see?","What specifically should the agent focus on?"]]'

  enforce-pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve metadata labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const current = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: pullNumber, per_page: 100
            });
            const workflowLabels = [
              '1-triage',
              '2-discussing',
              '3-human-queue',
              '3-clanker-queue',
              '4-review'
            ];
            for (const name of current.data
              .map(({ name }) => name)
              .filter((name) => workflowLabels.includes(name) && name !== '4-review')) {
              await github.rest.issues.removeLabelFromIssue({
                owner, repo, issue_number: pullNumber, name
              });
            }
            if (!current.data.some(({ name }) => name === '4-review')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pullNumber, labels: ['4-review']
              });
            }
            core.notice('Pull request set to 4-review; metadata labels preserved');
